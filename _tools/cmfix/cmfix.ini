; cmfix settings. Lines starting with ; are comments.
; Every setting can also be given as an environment variable CMFIX_<NAME> (e.g. CMFIX_TEXT4K=1),
; which wins over this file.
[cmfix]
; 1 = crisp game text redrawn at the screen resolution (needs cnc-ddraw with renderer=opengl).
; Only for the "Futuristic" fonts; with "Traditional" the game draws its text as before.
text4k=1
; TrueType font for the redrawn text. If it is not installed, text4k turns itself off.
; Eras Demi ITC comes with Microsoft Office.
text4k_font=Eras Demi ITC
; Font for large titles (defaults to text4k_font).
;text4k_font_large=Eras Demi ITC
; Text size factor (default 1.33) and vertical shift in game pixels (default 0).
;text4k_em=1.33
;text4k_yoff=0
; 1 = text being typed (input fields such as the player search) is crisp too, with its own
; caret; 0 = the game draws it, low-res, as before.
;text4k_input=1
; 1 = extra lines in cmfix.log
;text4k_debug=0
